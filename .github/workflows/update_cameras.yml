name: Auto Probe & Update Live Cameras

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 自动触发全球摄像头连通性巡检与 OTA 数据更新
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击 Run workflow 触发
  push:
    branches:
      - main
    paths:
      - 'tools/probe_live_sources.py'
      - '.github/workflows/update_cameras.yml'

# 设置写权限以便 GitHub Actions Bot 将更新提交推回 main 分支
permissions:
  contents: write

concurrency:
  group: update-cameras
  cancel-in-progress: true

jobs:
  probe-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Camera Probe Pipeline
        run: |
          python tools/probe_live_sources.py

      - name: Commit and Push Updated OTA Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存生成的更新数据与探针报告
          git add data/places_live.json data/places_ota.json docs/live_sources_report.md

          # 检查是否有文件改动，若无改动则优雅跳过，避免产生空提交
          if git diff --staged --quiet; then
            echo "[OK] No changes detected. All camera datasets are up-to-date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(live): auto update verified camera sources [skip ci] (${TIMESTAMP})"
            git push origin main
            echo "[SUCCESS] Updated camera datasets pushed to main successfully!"
          fi
